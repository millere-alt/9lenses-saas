name: Deploy Backend to Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: '9vectors-api'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'api'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies (for local validation only)
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm install
          npm run build --if-present
          npm run test --if-present
          popd

      - name: Remove node_modules (remote build will reinstall)
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          echo "Removing node_modules to allow remote build..."
          rm -rf node_modules
          echo "✓ node_modules removed - Azure will install dependencies during deployment"
          popd

      - name: Verify package structure
        shell: bash
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          echo "✓ Package contents:"
          ls -la
          echo ""
          echo "✓ Verifying critical files:"
          test -f "package.json" && echo "  ✓ package.json exists" || (echo "  ✗ package.json missing" && exit 1)
          test -f "host.json" && echo "  ✓ host.json exists" || (echo "  ✗ host.json missing" && exit 1)
          test -d "src" && echo "  ✓ src/ exists" || (echo "  ✗ src/ missing" && exit 1)

      - name: Create deployment package
        shell: bash
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r ../deployment.zip . -x "*.git*" "*.vscode*" "local.settings.json" "test-*.js" "*.log"
          ls -lh ../deployment.zip

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions (Flex Consumption) with Remote Build
        shell: bash
        run: |
          az functionapp deployment source config-zip \
            --resource-group 9vectors-rg \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --src deployment.zip \
            --build-remote true

      - name: Configure Function App Settings
        shell: bash
        run: |
          az functionapp config appsettings set \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group 9vectors-rg \
            --settings \
              NODE_ENV="production" \
              COSMOS_ENDPOINT="${{ secrets.COSMOS_ENDPOINT }}" \
              COSMOS_KEY="${{ secrets.COSMOS_KEY }}" \
              COSMOS_DATABASE="${{ secrets.COSMOS_DATABASE }}" \
              COSMOS_CONTAINER="${{ secrets.COSMOS_CONTAINER }}" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
              AZURE_COMMUNICATION_CONNECTION_STRING="${{ secrets.AZURE_COMMUNICATION_CONNECTION_STRING }}" \
              AZURE_COMMUNICATION_SENDER_EMAIL="${{ secrets.AZURE_COMMUNICATION_SENDER_EMAIL }}" \
              FRONTEND_URL="${{ secrets.FRONTEND_URL }}"

      - name: Verify deployment
        shell: bash
        run: |
          echo "Waiting 30 seconds for deployment to complete..."
          sleep 30

          echo "Checking function app status..."
          az functionapp show \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group 9vectors-rg \
            --query "{state:state, defaultHostName:defaultHostName}" \
            -o json

      - name: Health check
        shell: bash
        run: |
          echo ""
          echo "Testing health endpoint..."
          curl -f https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health || echo "⚠️  Health endpoint not yet available"

      - name: Deployment summary
        if: success()
        run: |
          echo "========================================="
          echo "✅ Backend Deployment Complete!"
          echo "========================================="
          echo ""
          echo "🌐 API URL: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api"
          echo "🏥 Health: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
          echo ""
          echo "📦 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "========================================="
