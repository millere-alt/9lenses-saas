name: Deploy Marketing Website to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - '9vectors.com/**'
      - '.github/workflows/deploy-marketing.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - '9vectors.com/**'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Marketing Website
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp 9vectors.com/website-9vectors.html deploy/index.html
          echo "Deployment files prepared:"
          ls -la deploy/

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_MARKETING_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "deploy"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Marketing website deployed successfully to Azure Static Web Apps"
          echo "🌐 URL: https://www.9vectors.com"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_MARKETING_WEB_APPS_API_TOKEN }}
          action: "close"
